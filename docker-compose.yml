services:
  people:
    build:
      context: .
      dockerfile: apps/people/Dockerfile
    ports:
      - "8081:80"

  delivery:
    build:
      context: .
      dockerfile: apps/delivery/Dockerfile
    ports:
      - "8082:80"

  shell:
    build:
      context: .
      dockerfile: apps/shell/Dockerfile
    environment:
      # Browser loads remotes from host-mapped ports. Change these and recreate
      # the shell container only — no Shell image rebuild required.
      PEOPLE_REMOTE_URL: http://localhost:8081/remoteEntry.js
      DELIVERY_REMOTE_URL: http://localhost:8082/remoteEntry.js
    ports:
      - "8080:80"
    depends_on:
      - people
      - delivery
