services:
  people:
    build:
      context: .
      dockerfile: apps/people/Dockerfile
    ports:
      - "8081:80"

  delivery:
    build:
      context: .
      dockerfile: apps/delivery/Dockerfile
    ports:
      - "8082:80"

  shell:
    build:
      context: .
      dockerfile: apps/shell/Dockerfile
    environment:
      # Browser loads remotes from host-mapped ports. Override on recreate
      # without rebuilding the Shell image, e.g.:
      # DELIVERY_REMOTE_URL=http://127.0.0.1:8082/remoteEntry.js docker compose up -d --force-recreate --no-build shell
      PEOPLE_REMOTE_URL: ${PEOPLE_REMOTE_URL:-http://localhost:8081/remoteEntry.js}
      DELIVERY_REMOTE_URL: ${DELIVERY_REMOTE_URL:-http://localhost:8082/remoteEntry.js}
    ports:
      - "8080:80"
    depends_on:
      - people
      - delivery
